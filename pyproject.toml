[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "upgrade-audit"
version = "1.6.0"
description = "Read-only fleet logic audit when a new Grok generation ships"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "reportlab>=4.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
console = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]

[project.scripts]
upgrade-audit = "upgrade_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
