[metadata]
name = upgrade-audit
version = 1.2.0
description = Read-only fleet logic audit when a new Grok generation ships

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    PyYAML>=6.0
    reportlab>=4.0
    pypdf>=4.0

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=7.0

[options.entry_points]
console_scripts =
    upgrade-audit = upgrade_audit.cli:main
